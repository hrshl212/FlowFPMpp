name: CPU tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran openmpi-bin libopenmpi-dev
      - name: Serial tests
        run: make test FC=gfortran
      - name: MPI tests
        run: make mpi-tests FC=gfortran MPIFC=mpifort MPIEXEC="mpirun --oversubscribe"
